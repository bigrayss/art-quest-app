# 彩绘冒险（ArtQuest）的 iOS 工程。桌面上显示的名字在 Info.plist 的 CFBundleDisplayName；PRODUCT_NAME 只是包名，别改（CI 认它）。用 XcodeGen 生成 .xcodeproj：
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open ArtQuest.xcodeproj
#
# .xcodeproj 不进仓库（见 ios/.gitignore）：它是这个文件的派生物，两份都改就会打架。
# 网页外壳 `../static` 以**文件夹引用**（蓝色文件夹）的方式整个打进 app 包，
# 所以 `static/` 只有一份——改网页版就是改 app，不用同步、不用复制。
name: ArtQuest
options:
  bundleIdPrefix: cn.ddhulu
  # 生成的 .xcodeproj 按这个版本的格式写。不写的话 XcodeGen 按最新 Xcode 的格式生成，
  # Big Sur 上的 Xcode 13.2.1 会说「这是未来版本的工程，打不开」。新 Xcode 打开老格式没问题。
  xcodeVersion: "13.2.1"
  # 上面那行 XcodeGen 新版并不真的听：生成出来的 objectVersion 仍是新 Xcode 的。
  # 所以生成完立刻把两处版本号改回 Xcode 13 的（55）——新 Xcode 打开老格式没问题，反过来不行。
  postGenCommand: perl -pi -e 's/objectVersion = \d+;/objectVersion = 55;/; s/compatibilityVersion = "Xcode [\d.]+";/compatibilityVersion = "Xcode 13.0";/' ArtQuest.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: "14.0"   # 用到的最新接口是 iOS 14 的（SwiftUI App 生命周期、UTType）；Xcode 12.4 起能编
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    # 代码里没用到新语法——Xcode 12.4（macOS 10.15.4）起都能编
    SWIFT_VERSION: "5.3"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone + iPad。iPad 是创作设备，iPhone 是看的设备（见 README「iPhone 和 iPad 不是同一件事」）
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
targets:
  ArtQuest:
    type: application
    platform: iOS
    sources:
      - path: ArtQuest
        excludes:
          - "**/.DS_Store"
      # 网页外壳：整个目录原样进包，运行时由 BundleSchemeHandler 从 artquest://app/ 端出去
      - path: ../static
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.ddhulu.artquest
        PRODUCT_NAME: KidsArtQuest
        INFOPLIST_FILE: Info.plist   # 放在 sources 目录外面，免得被当资源再拷一份；不用 XcodeGen 的 info: 生成，手写的才是权威
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # 模拟器不需要签名。免费 Apple ID 在没登记过任何真机之前，Xcode 造不出描述文件，
        # Signing 那页会一直报红——但那只关真机的事。这两行让模拟器构建根本不去要签名。
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        # 在 Xcode 的 Signing & Capabilities 里选自己的 Team，或者在这里填 Team ID
        DEVELOPMENT_TEAM: ""
        # 正式服务器。调试时不用改这里——系统「设置 → KidsArtQuest → 服务器地址」能临时覆盖
        ARTQUEST_SERVER: "https://art.ddhulu.cn"
