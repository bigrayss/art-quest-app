# 把 app 发到 TestFlight——不需要手边有一台新 Mac，GitHub 的 macOS 机器上是最新的 Xcode。
#
# 前提（一次性，都在网页上做）：
#   1. Apple Developer Program 付费会员（TestFlight 只给付费账号）。
#   2. App Store Connect → 用户和访问 → 集成 → App Store Connect API：生成一个 key（角色 App Manager），
#      下载 .p8。记下 Key ID 和 Issuer ID。
#   3. App Store Connect → App → 新建 App，Bundle ID 选 cn.ddhulu.kidsartquest（没有就先在开发者网站 Identifiers 里登记）。
#   4. 仓库 Settings → Secrets and variables → Actions，加四个 secret：
#        ASC_KEY_ID      Key ID
#        ASC_ISSUER_ID   Issuer ID
#        ASC_KEY_P8      .p8 文件的内容（整段文本，含 BEGIN/END 那两行）
#        APPLE_TEAM_ID   开发者账号的 Team ID（开发者网站 Membership 页上，10 位）
#
# 然后在 Actions 页面手动运行这条（workflow_dispatch）。签名用 Xcode 的云端托管证书
# （-allowProvisioningUpdates + API key），仓库里不用放任何证书和 .p12。
# 上传成功后 10–30 分钟，TestFlight app 里就能装。iPad 上装 TestFlight，用同一个 Apple ID 登录即可。
name: TestFlight
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 生成 .xcodeproj
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: App Store Connect API key 落盘
        # 粘进 secret 时首尾行或换行常常丢（第一次就栽在 invalidPEMDocument）：
        # 这里只取 base64 正文，按 64 列重新折行，头尾自己补，怎么粘都行。
        run: |
          mkdir -p ~/.private_keys
          body="$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')"
          if [ -z "$body" ]; then echo "::error::ASC_KEY_P8 是空的"; exit 1; fi
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$body" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } \
            > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          # 只报行数和长度，不打印内容
          echo "p8: $(wc -l < ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8) lines, body ${#body} chars (正常约 200)"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      # 打包直接用发布签名（Apple Distribution）：默认的开发签名要团队里至少登记一台设备，
      # CI 上没有设备，第一次就栽在「Your team has no devices」。发布签名不要设备。
      - name: Archive（构建号 = 这次运行的序号，每次都往上涨）
        run: |
          cd ios
          xcodebuild -project ArtQuest.xcodeproj -scheme ArtQuest -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ArtQuest.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: 导出并上传到 App Store Connect
        run: |
          cd ios
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ArtQuest.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
